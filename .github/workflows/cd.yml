name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image SHA
        id: tags
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Check if overlays already match
        id: check
        env:
          SHA: ${{ steps.tags.outputs.sha }}
          REG: ${{ secrets.ECR_REGISTRY }}
        run: |
          if grep -qF "${REG}/aegismesh-backend:${SHA}" platform/kubernetes/overlays/prod/patch-backend-image.yaml &&
             grep -qF "${REG}/aegismesh-frontend:${SHA}" platform/kubernetes/overlays/prod/patch-frontend-image.yaml; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update k8s image patches
        if: steps.check.outputs.skip != 'true'
        env:
          SHA: ${{ steps.tags.outputs.sha }}
          REG: ${{ secrets.ECR_REGISTRY }}
        run: |
          bash .github/scripts/update-k8s-images.sh "${REG}/aegismesh-backend:${SHA}" "${REG}/aegismesh-frontend:${SHA}"

      - name: Create or update deploy PR
        if: steps.check.outputs.skip != 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: "ci: deploy ${{ steps.tags.outputs.sha }} [skip ci]"
          branch: bot/deploy-${{ steps.tags.outputs.sha }}
          title: "ci: deploy ${{ steps.tags.outputs.sha }}"
          body: |
            Automated overlay update from CD workflow.

            **Image**: `${{ secrets.ECR_REGISTRY }}/aegismesh-backend:${{ steps.tags.outputs.sha }}`
            Auto-merge enabled — will squash to main on CI pass.
          delete-branch: true
          labels: automated-deploy

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash --delete-branch

      - name: Create GitHub deployment
        if: steps.pr.outputs.pull-request-number
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'bot/deploy-${{ steps.tags.outputs.sha }}',
              environment: 'production',
              required_contexts: [],
              auto_merge: false
            });

      - name: Notify failure
        if: failure() && github.event_name == 'workflow_run'
        run: |
          echo "CD failed for SHA ${{ steps.tags.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
