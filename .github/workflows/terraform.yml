name: Terraform

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'platform/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action: plan or apply'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-plan:
    if: ${{ github.event_name == 'pull_request' || github.event.inputs.action == 'plan' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: |
          cd platform/terraform
          terraform init
      - name: Terraform Plan
        id: plan
        run: |
          cd platform/terraform
          terraform plan -out=plan.tfplan -no-color 2>&1
          terraform show -no-color plan.tfplan | tee plan.txt
      - name: Upload plan
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: platform/terraform/plan.tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('platform/terraform/plan.txt', 'utf8').substring(0, 60000);
            const body = output.trim()
              ? '## Terraform Plan\n```\n' + output + '\n```'
              : '## Terraform Plan\n_No changes._';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  terraform-apply:
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: |
          cd platform/terraform
          terraform init
      - name: Terraform Apply
        run: |
          cd platform/terraform
          terraform apply -auto-approve
