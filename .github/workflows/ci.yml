name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/security-engine/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/security-engine/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  lint:
    name: "Lint & Typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Cache turbo build
        id: turbo-cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npx turbo run build --filter=@aegismesh/shared
      - run: npx turbo run lint

  backend:
    name: "Backend: test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Cache turbo build
        id: turbo-cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npx turbo run build --filter=@aegismesh/shared
      - run: npx turbo run test --filter=backend

  frontend:
    name: "Frontend: test / build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Cache turbo build
        id: turbo-cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npx turbo run build --filter=@aegismesh/shared
      - run: npx turbo run lint --filter=frontend
      - run: npx turbo run test --filter=frontend
      - run: npx turbo run build --filter=frontend

  docker:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [lint, backend, frontend]
    timeout-minutes: 30
    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.ECR_REGISTRY }}/aegismesh-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.ECR_REGISTRY }}/aegismesh-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push security-engine
        uses: docker/build-push-action@v6
        with:
          context: apps/security-engine
          file: apps/security-engine/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.ECR_REGISTRY }}/aegismesh-security-engine:${{ github.sha }}
          cache-from: type=gha,scope=security-engine
          cache-to: type=gha,mode=max,scope=security-engine

      - name: Smoke test
        if: github.ref == 'refs/heads/main'
        run: |
          echo "All 3 images built successfully (push skipped on PR)"
          docker images --filter=reference='*aegismesh*'
