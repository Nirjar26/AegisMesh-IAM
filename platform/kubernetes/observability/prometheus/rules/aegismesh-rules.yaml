apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: Bastion-rules
  namespace: monitoring
spec:
  groups:
    - name: Bastion.rules
      rules:
        - alert: BastionHighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="Bastion"}[5m])) by (pod) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Bastion pod high CPU"
            description: "Pod {{ $labels.pod }} in namespace Bastion is using high CPU."
        - alert: BastionHighMemory
          expr: sum(container_memory_usage_bytes{namespace="Bastion"}) by (pod) > 200 * 1024 * 1024
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Bastion pod high memory"
            description: "Pod {{ $labels.pod }} in namespace Bastion is using high memory."
