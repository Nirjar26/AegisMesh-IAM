apiVersion: v1
kind: ConfigMap
metadata:
  name: Bastion-config
  namespace: Bastion
data:
  NODE_ENV: production
  PORT: "5000"
  DB_PORT: "5432"
  LOG_LEVEL: info
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Use HTTPS by default. Ensure TLS termination is provided by your ingress
  # / reverse proxy (recommended). For local development you can override
  # these values to use http, but do so intentionally.
  FRONTEND_URL: https://Bastion.localhost:3000
