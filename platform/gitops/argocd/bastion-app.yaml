apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: Bastion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/nirjxr26/Bastion-IAM'
    targetRevision: main
    path: platform/kubernetes/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: Bastion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
